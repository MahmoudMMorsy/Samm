<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
            color: #39FF14;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #status {
            position: absolute;
            font-size: 14px;
            color: #39FF14;
            text-shadow: 0 0 5px #39FF14;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <div id="status">INITIALIZING SYSTEM...</div>
        <canvas id="emulatorCanvas" class="hidden"></canvas>
    </div>

    <!-- Integrate local compiled offline Game Boy Advance core -->
    <script src="gba_core.js"></script>

    <script>
        var gbaInstance = null;
        var canvas = document.getElementById('emulatorCanvas');
        var statusDiv = document.getElementById('status');
        var audioContext = null;
        var fastForwardEnabled = false;

        // Custom base64 to binary converter
        function base64ToBinary(base64) {
            var binaryString = window.atob(base64);
            var len = binaryString.length;
            var bytes = new Uint8Array(len);
            for (var i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Initialize and boot Game Boy Advance ROM
        window.loadRom = function(base64Data) {
            try {
                showStatus("LOADED GBA ENGINE... BOOTING ROM...");
                
                // Clear any existing instance
                if (gbaInstance) {
                    try { gbaInstance.pause(); } catch(e) {}
                    gbaInstance = null;
                }

                // Decode base64 to ArrayBuffer
                var romArrayBuffer = base64ToBinary(base64Data);

                // Prepare canvas
                canvas.className = "";
                statusDiv.className = "hidden";

                // Warm up Audio context on gesture fallback
                initAudio();

                // Instantiate emulator
                gbaInstance = new GameBoyAdvance();
                gbaInstance.setCanvas(canvas);
                gbaInstance.logLevel = gbaInstance.LOG_ERROR;

                if (audioContext && gbaInstance.audio) {
                    gbaInstance.audio.audioContext = audioContext;
                }

                // Load ROM
                gbaInstance.setRom(romArrayBuffer);

                // Setup fast forward interception hook on advanceFrame
                var originalAdvance = gbaInstance.advanceFrame;
                gbaInstance.advanceFrame = function() {
                    originalAdvance.call(gbaInstance);
                    if (fastForwardEnabled) {
                        originalAdvance.call(gbaInstance); // 2x Execution speed
                    }
                };

                // Boot the loop
                gbaInstance.runStable();
                showStatus("EMULATOR ACTIVE");
                console.log("Game Boy Advance booted successfully offline via GBAJS.");
                return "SUCCESS";
            } catch (err) {
                console.error(err);
                showStatus("BOOT ERROR: " + err.message);
                return "ERROR: " + err.message;
            }
        };

        // Inject saved battery state SRAM string (Base64)
        window.injectSRAM = function(base64SRAM) {
            if (gbaInstance) {
                try {
                    gbaInstance.decodeSavedata(base64SRAM);
                    return "SRAM LOADED SUCCESS";
                } catch(e) {
                    return "SRAM LOAD FAILED: " + e.message;
                }
            }
            return "NO EMULATOR INSTANCE ACTIVE";
        };

        // Export current SRAM save state (battery RAM) as Base64 to save locally
        window.getSRAM = function() {
            if (gbaInstance && gbaInstance.mmu && gbaInstance.mmu.save) {
                try {
                    var sram = gbaInstance.mmu.save;
                    return gbaInstance.encodeBase64(sram.view);
                } catch(e) {
                    return "";
                }
            }
            return "";
        };

        // Save State (Defreeze snapshot structure to JSON string)
        window.getSaveState = function() {
            if (gbaInstance) {
                try {
                    var stateObj = gbaInstance.freeze();
                    return JSON.stringify(stateObj);
                } catch(e) {
                    return "ERROR: " + e.message;
                }
            }
            return "NO GAME RUNNING";
        };

        // Load State (Restore complete snapshot structure from JSON string)
        window.loadSaveState = function(stateJson) {
            if (gbaInstance) {
                try {
                    var stateObj = JSON.parse(stateJson);
                    gbaInstance.defrost(stateObj);
                    return "SUCCESS";
                } catch(e) {
                    return "ERROR: " + e.message;
                }
            }
            return "NO GAME RUNNING";
        };

        // Speed fast forward toggle
        window.setFastForward = function(enable) {
            fastForwardEnabled = enable;
            return "FAST FORWARD UPDATED TO: " + (enable ? "2.0x" : "1.0x");
        };

        function showStatus(text) {
            statusDiv.className = "";
            statusDiv.innerText = text;
        }

        // Initialize user audio session gesture
        function initAudio() {
            if (typeof AudioContext !== "undefined") {
                if (!audioContext) audioContext = new AudioContext();
                if (audioContext.state === "suspended") {
                    audioContext.resume();
                }
            }
        }

        // Bridge controller buttons
        // Android Controller Mapping: 0: RIGHT, 1: LEFT, 2: UP, 3: DOWN, 4: A, 5: B, 6: SELECT, 7: START
        function mapGbcToGba(gbcIndex) {
            var index = parseInt(gbcIndex);
            switch (index) {
                case 0: return 4; // RIGHT
                case 1: return 5; // LEFT
                case 2: return 6; // UP
                case 3: return 7; // DOWN
                case 4: return 0; // A
                case 5: return 1; // B
                case 6: return 2; // SELECT
                case 7: return 3; // START
                case 8: return 8; // R (GBA specific)
                case 9: return 9; // L (GBA specific)
                default: return index;
            }
        }

        window.pressButton = function(btnIndex) {
            initAudio();
            if (gbaInstance && gbaInstance.keypad) {
                var gbaKey = mapGbcToGba(btnIndex);
                var toggle = 1 << gbaKey;
                gbaInstance.keypad.currentDown &= ~toggle;
            }
        };

        window.releaseButton = function(btnIndex) {
            if (gbaInstance && gbaInstance.keypad) {
                var gbaKey = mapGbcToGba(btnIndex);
                var toggle = 1 << gbaKey;
                gbaInstance.keypad.currentDown |= toggle;
            }
        };

        // Startup verification of the core
        window.onload = function() {
            if (typeof GameBoyAdvance === "undefined") {
                showStatus("SYSTEM STANDBY: REQUIRES COMPILED OFFLINE CORE.");
            } else {
                showStatus("RETRO CORE: ONLINE\nREADY TO BOOT GBA GAME");
            }
        };
    </script>
</body>
</html>
